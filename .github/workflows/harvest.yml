# Every 10 minutes: donors' cloud sessions have no GitHub tools, they only push claude/ats-<n> to
# their fork. The newest commit of that branch ends with Antipode-* trailers; this turns them into
# the pull request (opened by the antipode-bot account) and the record on the request.
name: Harvest

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: harvest

jobs:
  harvest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Harvest delivered branches
        env:
          GH_TOKEN: ${{ github.token }}
          ANTIPODE_BOT_TOKEN: ${{ secrets.ANTIPODE_BOT_TOKEN }}
        run: python3 scripts/ats.py harvest
